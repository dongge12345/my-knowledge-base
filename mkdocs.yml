---
site_name: 个人知识库
site_description: 基于 GitHub Pages 发布的个人知识库站点。

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: amber
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 知识库总览: _generated/index.md
  - 部署说明: setup.md
