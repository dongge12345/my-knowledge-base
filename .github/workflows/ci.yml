---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt

      - name: Run yamllint
        run: >
          yamllint -c .yamllint.yml
          .github/workflows
          mkdocs.yml
          .markdownlint-cli2.yaml
          .yamllint.yml

  python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m py_compile scripts/build_catalog.py tests/test_build_catalog.py

      - name: Run Ruff
        run: ruff check scripts tests

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2

      - name: Run markdownlint
        run: markdownlint-cli2

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs:
      - yaml
      - python
      - markdown
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  build:
    name: Build Preview
    runs-on: ubuntu-latest
    needs:
      - yaml
      - python
      - markdown
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate knowledge-base pages
        run: python scripts/build_catalog.py

      - name: Build site
        run: mkdocs build --strict

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-pr-${{ github.event.pull_request.number }}
          path: site
          if-no-files-found: error
          retention-days: 7
