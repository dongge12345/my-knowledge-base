<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>好物置换汇总</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
    <script src="exportMonthConst.js"></script>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }

        h3 {
            color: #34495e;
            margin-bottom: 15px;
            font-size: 20px;
        }

        /* 文件输入区域 */
        .file-input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .file-input-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-input-item label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #3498db;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(149, 165, 166, 0.3);
        }

        .btn-success {
            background-color: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        /* 结果显示区域 */
        .results-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e1e8ed;
        }

        .result-box {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
        }

        .result-box h4 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .result-box pre {
            background-color: #fff;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        /* 数据表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .data-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .data-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .data-table tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>好物置换汇总</h1>
        
        <div class="file-input-group">
            <!-- <input type="file" id="fileInput" multiple>
            <button onclick="createZip()">创建 ZIP</button> -->
            <div class="file-input-item">
                <label for="excel-file">选择初始好物置换汇总excel文件</label>
                <input type="file" id="excel-file" accept=".xlsx" />
            </div>
            <button class="btn btn-primary" onclick="readExcelFile()">读取文件</button>
            <button class="btn btn-secondary" onclick="printDataStructure()">打印数据结构</button>
            <button class="btn btn-success" onclick="writeExcelFile()">写入文件</button>
        </div>

        <div class="results-section">
            <div class="result-box">
                <h4>文件信息</h4>
                <pre id="file-info">等待文件读取...</pre>
            </div>

            <div class="result-box">
                <h4>数据结构</h4>
                <pre id="data-structure">等待数据处理...</pre>
            </div>

            <div class="result-box">
                <h4>工作表数据预览</h4>
                <div id="sheet-preview">选择文件并读取以查看预览</div>
            </div>
        </div>
    </div>

    <script>
        
        async function createZip() {
            const files = document.getElementById('fileInput').files;
            const zip = new JSZip();
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const cellImagesFile = zip.file(file.name, file);
                const decoder = new TextDecoder('utf-8');
                const str = decoder.decode(await cellImagesFile.files[file.name]._data);
            }
        }
        // 全局变量存储Excel工作簿数据
        let workbook = null;
        let originalFileName = "";
        // 用于存储DISPIMG ID与实际图片路径的映射关系
        let dispImgIdToImagePathMap = new Map();
        
        /**
         * 从Excel文件中提取并解析cellimages.xml和cellimages.xml.rels文件
         * 建立DISPIMG ID与实际图片路径的映射关系
         */
        async function extractCellImagesInfo(file) {
            try {
                // 重置映射
                dispImgIdToImagePathMap.clear();
                
                // 使用JSZip直接读取Excel文件（作为ZIP文件）
                const zip = await JSZip.loadAsync(await file.arrayBuffer());
                
                // 提取cellimages.xml.rels文件
                const cellImagesRelsFile = zip.file('xl/_rels/cellimages.xml.rels');
                if (!cellImagesRelsFile) {
                    
                    return;
                }
                
                // 读取并解析cellimages.xml.rels内容
                const cellImagesRelsContent = await cellImagesRelsFile.async('string');
                
                // 创建REL ID到图片路径的映射
                const relIdToImagePathMap = new Map();
                
                // 使用正则表达式提取REL ID和对应的图片路径
                const relRegex = /<Relationship Id="(rId\d+)"[^>]*?Target="([^"]+)"[^>]*?>/g;
                let match;
                while ((match = relRegex.exec(cellImagesRelsContent)) !== null) {
                    const relId = match[1];
                    const imagePath = match[2];
                    relIdToImagePathMap.set(relId, imagePath);
                    
                }
                
                // 提取cellimages.xml文件
                const cellImagesFile = zip.file('xl/cellimages.xml');
                if (!cellImagesFile) {
                    
                    return;
                }
                
                // 读取并解析cellimages.xml内容
                const cellImagesContent = await cellImagesFile.async('string');
                
                // 使用正则表达式提取DISPIMG ID和对应的REL ID
                const cellImageRegex = /<xdr:cNvPr id="\d+" name="(ID_[0-9A-F]+)"[^>]*?>[\s\S]*?<a:blip r:embed="(rId\d+)"/g;
                
                while ((match = cellImageRegex.exec(cellImagesContent)) !== null) {
                    const dispImgId = match[1];
                    const relId = match[2];
                    
                    // 根据REL ID获取图片路径
                    const imagePath = relIdToImagePathMap.get(relId);
                    
                    if (imagePath) {
                        dispImgIdToImagePathMap.set(dispImgId, imagePath);
                        
                    } else {
                        
                    }
                }
                
                // 记录映射数量
                
                
            } catch (error) {
                console.error('解析cellimages文件时出错:', error);
            }
        }

        /**
         * 读取Excel文件
         */
        async function readExcelFile() {
            const fileInput = document.getElementById('excel-file');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请先选择一个Excel文件');
                return;
            }
            
            originalFileName = file.name;
            
            try {
                // 显示加载状态
                document.getElementById('file-info').textContent = '正在读取文件...';
                document.getElementById('data-structure').textContent = '正在处理数据...';
                document.getElementById('sheet-preview').innerHTML = '正在生成预览...';
                
                // 先提取并解析cellimages.xml和cellimages.xml.rels文件，建立DISPIMG ID映射
                await extractCellImagesInfo(file);
                
                // 使用ExcelJS读取文件，启用图片加载，特别是嵌入单元格的图片
                workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(await file.arrayBuffer(), { 
                    imageBase64: true, // 确保图片以base64格式加载
                    hyperlinks: true,
                    // 新增：确保嵌入单元格的图片信息被正确读取
                    includeImageRefs: true, // 包含图片引用信息
                    raw: true, // 保留原始文件结构，不进行额外处理
                    preserveDrawingObjects: true // 保留绘图对象，包括嵌入单元格的图片
                });
                
                // 检测并记录DISPIMG函数（特殊图片引用方式）
                detectDispImgFunctions();
                
                // 记录所有图片资源信息，用于调试
                logAllImages();
                
                // 显示文件信息
                displayFileInfo();
                
                // 自动打印数据结构
                printDataStructure();
                
                // 生成工作表预览
                generateSheetPreview();
                
                alert('文件读取成功！');
                
            } catch (error) {
                console.error('读取文件时出错:', error);
                alert('读取文件时出错: ' + error.message);
                document.getElementById('file-info').textContent = '读取文件出错: ' + error.message;
            }
        }

        /**
         * 显示文件信息
         */
        function displayFileInfo() {
            if (!workbook) return;
            
            let info = {
                fileName: originalFileName,
                sheetCount: workbook.worksheets.length,
                sheets: workbook.worksheets.map(sheet => sheet.name),
                created: workbook.properties.created,
                modified: workbook.properties.modified,
                author: workbook.properties.author || '未知'
            };
            
            document.getElementById('file-info').textContent = JSON.stringify(info, null, 2);
        }

        /**
         * 打印数据结构
         */
        function printDataStructure() {
            if (!workbook) {
                alert('请先读取Excel文件');
                return;
            }
            
            try {
                let dataStructure = {};
                
                workbook.worksheets.forEach(sheet => {
                    let sheetData = [];
                    let rowCount = 0;
                    
                    // 遍历行
                    sheet.eachRow((row, rowNumber) => {
                        if (rowCount >= 20) return; // 只显示前20行用于预览
                        
                        let rowData = {};
                        
                        // 遍历单元格
                        row.eachCell((cell, colNumber) => {
                            let cellInfo = {
                                value: cell.value,
                                type: cell.type,
                                formula: cell.formula || null,
                                hasStyle: !!cell.style,
                                address: cell.address
                            };
                            
                            // 如果有样式，添加基本样式信息
                            if (cell.style) {
                                cellInfo.style = {
                                    font: cell.style.font ? Object.keys(cell.style.font) : [],
                                    fill: cell.style.fill ? Object.keys(cell.style.fill) : [],
                                    border: cell.style.border ? Object.keys(cell.style.border) : [],
                                    alignment: cell.style.alignment ? Object.keys(cell.style.alignment) : []
                                };
                            }
                            
                            rowData[colNumber] = cellInfo;
                        });
                        
                        sheetData.push({
                            rowNumber: rowNumber,
                            cells: rowData
                        });
                        
                        rowCount++;
                    });
                    
                    dataStructure[sheet.name] = {
                        rowCount: sheet.rowCount,
                        columnCount: sheet.columnCount,
                        sampleData: sheetData
                    };
                });
                // // 暂时注释
                // document.getElementById('data-structure').textContent = JSON.stringify(dataStructure, null, 2);
                
            } catch (error) {
                console.error('打印数据结构时出错:', error);
                alert('打印数据结构时出错: ' + error.message);
            }
        }

        /**
         * 生成工作表预览
         */
        function generateSheetPreview() {
            if (!workbook) return;
            
            let previewHTML = '';
            
            workbook.worksheets.forEach((sheet, index) => {
                if(index === 4) {
                    window.targetSheet = sheet
                }
                previewHTML += `<h5>工作表 ${index + 1}: ${sheet.name}</h5>`;
                previewHTML += '<table class="data-table">';
                
                // 添加表头
                previewHTML += '<thead><tr>';
                for (let col = 1; col <= Math.min(10, sheet.columnCount); col++) {
                    previewHTML += `<th>${getColumnName(col)}</th>`;
                }
                previewHTML += '</tr></thead>';
                
                // 添加数据行
                previewHTML += '<tbody>';
                let rowCount = 0;
                
                sheet.eachRow((row, rowNumber) => {
                    if (rowCount >= 10) return; // 只显示前10行
                    
                    previewHTML += '<tr>';
                    
                    for (let col = 1; col <= Math.min(10, sheet.columnCount); col++) {
                        const cell = row.getCell(col);
                        let cellValue = cell.value;
                        
                        // 格式化单元格值
                        if (cellValue && typeof cellValue === 'object') {
                            if (cellValue.formula) {
                                cellValue = `= ${cellValue.result || cellValue.formula}`;
                            } else if (cellValue.richText) {
                                cellValue = 'Rich Text';
                            } else {
                                cellValue = JSON.stringify(cellValue);
                            }
                        }
                        
                        previewHTML += `<td title="${cell.address}${cell.formula ? '\n公式: ' + cell.formula : ''}">${cellValue || ''}</td>`;
                    }
                    
                    previewHTML += '</tr>';
                    rowCount++;
                });
                
                previewHTML += '</tbody></table><br>';
            });
            
            // // 暂时注释
            // document.getElementById('sheet-preview').innerHTML = previewHTML;
        }

        /**
         * 将列号转换为Excel列名 (1 -> A, 26 -> Z, 27 -> AA)
         */
        function getColumnName(colNumber) {
            let columnName = '';
            let temp = colNumber;
            
            while (temp > 0) {
                let remainder = (temp - 1) % 26;
                columnName = String.fromCharCode(65 + remainder) + columnName;
                temp = Math.floor((temp - 1) / 26);
            }
            
            return columnName;
        }

        /**
         * 检测并记录DISPIMG函数（特殊图片引用方式）
         */
        function detectDispImgFunctions() {
            let dispImgCount = 0;
            
            workbook.worksheets.forEach(sheet => {
                // 遍历所有单元格，查找DISPIMG函数
                sheet.eachRow((row, rowNumber) => {
                    row.eachCell((cell, colNumber) => {
                        //   if (cell.formula) {
                        //       
                        //   }
                        // 检测DISPIMG函数，支持带_xlfn.前缀和不带前缀的情况
                        if (cell.formula && (cell.formula.startsWith('=DISPIMG(') || cell.formula.startsWith('_xlfn.DISPIMG('))) {
                            dispImgCount++;
                            
                            
                            // // 提取图片ID
                            // const imgIdMatch = cell.formula.match(/"([^"]+)"/);
                            // const imgId = imgIdMatch ? imgIdMatch[1] : '未知';
                            
                            
                            
                            
                            
                            // // 确保公式被正确保留
                            // if (cell.type === ExcelJS.ValueType.Formula && cell.result === '#REF!') {
                            //     
                            // }
                        }
                    });
                });
            });
            
            if (dispImgCount > 0) {
                
                document.getElementById('file-info').textContent += `\n\n发现 ${dispImgCount} 个DISPIMG函数引用（特殊图片类型）`;
            }
        }
        
        /**
         * 记录所有图片资源信息，用于调试
         */
        function logAllImages() {
            let totalImages = 0;
            
            workbook.worksheets.forEach(sheet => {
                if (sheet.images && sheet.images.length > 0) {
                    console.log(`\n工作表 "${sheet.name}" 包含 ${sheet.images.length} 张图片:`);
                    sheet.images.forEach((image, index) => {
                        totalImages++;
                        
                        
                        
                        
                        
                        // // 检查图片是否有ID属性
                        // if (image.id) {
                        //     
                        // } else if (image.imageId) {
                        //     
                        // } else {
                        //     
                        // }
                    });
                }
            });
            
            if (totalImages > 0) {
                
                document.getElementById('file-info').textContent += `\n文件中包含 ${totalImages} 张图片资源`;
            }
            
            // 记录DISPIMG ID与实际图片路径的映射关系
            if (dispImgIdToImagePathMap.size > 0) {
                document.getElementById('file-info').textContent += `\n建立了 ${dispImgIdToImagePathMap.size} 个DISPIMG ID与图片路径的映射关系`;
            }
        }
        
        /**
         * 将列号转换为列名（如1→A, 26→Z, 27→AA）
         */
        function getColumnName(columnNumber) {
            let columnName = '';
            let temp;
            let remainder;
            
            while (columnNumber > 0) {
                remainder = (columnNumber - 1) % 26;
                temp = String.fromCharCode(65 + remainder);
                columnName = temp + columnName;
                columnNumber = Math.floor((columnNumber - 1) / 26);
            }
            
            return columnName;
        }
        
        /**
         * 写入Excel文件
         */
        async function writeExcelFile() {
            if (!workbook) {
                alert('请先读取Excel文件');
                return;
            }
            
            try {
                // 先计算种草金额
                calculateZhongcaoJinE();
                alert('种草金额计算完成！');
                
                // 确保图片资源和DISPIMG函数被正确保存
                let dispImgCount = 0;
                let imgResourceCount = 0;
                let embeddedImageCount = 0;
                
                // 用于存储从ZIP文件中提取的图片资源
                const extractedImages = new Map();
                
                // 首先从原始Excel文件中提取所有图片资源
                try {
                    const fileInput = document.getElementById('excel-file');
                    const file = fileInput.files[0];
                    const zip = await JSZip.loadAsync(await file.arrayBuffer());
                    
                    // 获取所有图片文件
                    // 注意：JSZip的通配符语法可能因版本而异，尝试多种方式
                    let imageFiles = [];
                    
                    // 尝试1: 使用目录路径匹配（更可靠的方式）
                    const mediaFiles = zip.folder('xl/media');
                    if (mediaFiles) {
                        imageFiles = mediaFiles.file();
                    } else {
                        // 尝试2: 使用通配符匹配
                        imageFiles = zip.file('xl/media/');
                    }
                    
                    // 如果还是没有找到，尝试3: 获取所有文件并手动过滤
                    if (!imageFiles || imageFiles.length === 0) {
                        console.error('直接获取图片文件失败，使用替代方法查找图片');
                        const allFiles = zip.file();
                        imageFiles = allFiles.filter(file => file.name.startsWith('xl/media/'));
                        
                    }
                    
                    // 确保imageFiles是一个数组，避免for...of循环出错
                    const imageFilesArray =  Object.entries(imageFiles && imageFiles.files).filter(item=>item[0].includes('xl/media')).map(item=>item[1]) || [];
                    
                    for (const imageFile of imageFilesArray) {
                        const imagePath = imageFile.name;
                        const imageName = imagePath.split('/').pop();
                        
                        // 读取图片内容
                        const imageContent = await imageFile.async('arraybuffer');
                        const base64 = btoa(new Uint8Array(imageContent).reduce((data, byte) => data + String.fromCharCode(byte), ''));
                        
                        // 确定图片扩展名
                        const extension = imageName.split('.').pop().toLowerCase();
                        
                        // 存储图片信息
                        extractedImages.set(imageName, { base64, extension });
                    }
                    
                    
                } catch (error) {
                    console.error('提取图片资源时出错:', error);
                }
                
                workbook.worksheets.forEach(sheet => {
                    // 检查并验证图片资源
                    console.log(`\n工作表 "${sheet.name}" 包含 张图片资源:`,{sheet});
                    if (sheet.images && sheet.images.length > 0) {
                        imgResourceCount += sheet.images.length;
                        console.log(`\n工作表 "${sheet.name}" 包含 ${sheet.images.length} 张图片资源:`);
                    }
                    
                    // 检查DISPIMG函数并确保它们被正确处理
                    sheet.eachRow((row, rowNumber) => {
                        row.eachCell((cell, colNumber) => {
                            // 处理DISPIMG函数，支持带_xlfn.前缀和不带前缀的情况
                            if (cell.formula && (cell.formula.startsWith('=DISPIMG(') || cell.formula.startsWith('_xlfn.DISPIMG('))) {
                                dispImgCount++;
                                
                                // 提取图片ID
                                const imgIdMatch = cell.formula.match(/"([^"]+)"/);
                                const imgId = imgIdMatch ? imgIdMatch[1] : '未知';
                                
                                
                                
                                
                                
                                // 尝试根据图片ID获取图片路径
                                const imagePath = dispImgIdToImagePathMap.get(imgId);
                                if (imagePath) {
                                    
                                    
                                    // 从图片路径提取图片文件名
                                    const imageFileName = imagePath.split('/').pop();
                                    
                                    
                                    
                                    // 尝试将图片嵌入到单元格
                                    
                                    
                                    if (extractedImages.has(imageFileName)) {
                                        try {
                                            const imageInfo = extractedImages.get(imageFileName);
                                            
                                            
                                            // 添加图片到工作簿
                                            const imageId = workbook.addImage({
                                                base64: imageInfo.base64,
                                                extension: imageInfo.extension
                                            });
                                            
                                            
                                            // 嵌入图片到单元格
                                            sheet.addImage(imageId, {
                                                tl: { col: colNumber - 1, row: rowNumber - 1 },
                                                br: { col: colNumber, row: rowNumber },
                                                editAs: 'oneCell'
                                            });
                                            
                                            embeddedImageCount++;
                                            
                                            
                                            // 可选：移除原始公式，只保留图片
                                            // cell.value = undefined;
                                            // delete cell.formula;
                                            // delete cell.result;
                                            
                                        } catch (error) {
                                            console.error(`嵌入图片 ${imageFileName} 时出错:`, error);
                                            // 添加更多调试信息
                                            console.error(`  - 图片信息:`, imageInfo);
                                            console.error(`  - 单元格位置: ${getColumnName(colNumber)}${rowNumber}`);
                                        }
                                    } else {
                                        
                                    }
                                } else {
                                    
                                }
                                
                                // 确保公式类型正确
                                if (cell.type !== ExcelJS.ValueType.Formula) {
                                    cell.type = ExcelJS.ValueType.Formula;
                                }
                                
                                // 关键改进：正确设置公式单元格的值
                                // 保留原始公式字符串，确保ExcelJS能正确写入
                                cell.value = {
                                    formula: cell.formula,  // 保留完整的原始公式
                                    result: undefined        // 不设置结果，避免重新计算
                                };
                                // 暂不保留
                                cell.value = undefined
                                
                                // 删除可能导致冲突的属性
                                delete cell.result;
                                
                                // 对于带有_xlfn.前缀的公式，保持不变
                                // Excel会在需要时自动处理这个前缀
                            }
                        });
                    });
                });
                
                console.log(`共嵌入了 ${embeddedImageCount} 张图片到单元格`);
                
                // 生成新文件名
                const newFileName = `modified_${originalFileName}`;
                
                // 显示保存状态
                document.getElementById('file-info').textContent += '\n\n正在保存文件...';
                
                // 关键改进：使用raw选项保留原始Excel文件结构
                // 这有助于保持图片资源和它们的引用关系，特别是嵌入单元格的图片
                // 注意：WPS特有DISPIMG函数可能无法在Excel中完全兼容
                const buffer = await workbook.xlsx.writeBuffer({
                    imageBase64: true, // 确保图片以base64格式保存
                    hyperlinks: true,
                    calcProperties: {
                        fullCalcOnLoad: false, // 禁用加载时的完全重新计算
                        calcId: 1620198615, // 使用固定的计算ID避免重新计算
                        recalcId: 1 // 避免重新计算
                    },
                    // 关键：禁用自动修复和重新计算
                    ignoreEC: true, // 忽略错误检查
                    suppressFormulaRecalculation: true, // 禁止公式重新计算
                    // 新增：保留原始图片布局和属性，特别是嵌入单元格的图片
                    raw: true, // 保留原始文件结构，不进行额外处理
                    includeImageRefs: true, // 确保图片引用被正确保留
                    // 新增：保留原始公式结构，不进行转换
                    preserveFormulas: true, // 确保公式结构被完整保留
                    // 新增：禁用公式计算和验证
                    calculate: false, // 不进行公式计算
                    validateFormulas: false // 不验证公式
                });
                
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                
                // 使用FileSaver保存文件
                saveAs(blob, newFileName);
                
                // 增加WPS兼容性提示
                let alertMessage = `文件保存成功！新文件名: ${newFileName}`;
                alertMessage += `\n检测到 ${dispImgCount} 个DISPIMG函数引用（WPS特有）`;
                alertMessage += `\n文件中包含 ${imgResourceCount} 张图片资源`;
                
                if (dispImgCount > 0) {
                    alertMessage += `\n\n注意：DISPIMG是WPS特有函数，在Excel中可能无法正确显示！`;
                    alertMessage += `\n\n推荐解决方案：`;
                    alertMessage += `\n1. 在WPS中选中图片单元格，右键选择"切换为浮动图片"`;
                    alertMessage += `\n2. 重新保存文件后再使用本工具处理`;
                }
                
                // 生成提示信息
                let promptMessage = `文件处理完成！\n`;
                promptMessage += `原始文件名: ${originalFileName}\n`;
                promptMessage += `修改后文件名: ${newFileName}\n\n`;
                promptMessage += `发现 ${imgResourceCount} 个图片资源\n`;
                promptMessage += `找到 ${dispImgCount} 个DISPIMG函数\n`;
                promptMessage += `成功嵌入 ${embeddedImageCount} 张图片到表格中\n\n`;
                promptMessage += `✅  图片嵌入结果:\n`;
                if (embeddedImageCount > 0) {
                    promptMessage += `所有DISPIMG函数对应的图片已成功嵌入到表格中\n`;
                    promptMessage += `在Excel中打开时，图片将直接显示，不再显示#REF!错误\n`;
                } else {
                    promptMessage += `没有找到可嵌入的图片资源\n`;
                }
                promptMessage += `\n⚠️  重要提示:\n`;
                promptMessage += `1. 此文件已将WPS特有的DISPIMG函数转换为嵌入图片\n`;
                promptMessage += `2. 生成的文件与Microsoft Excel完全兼容\n`;
                promptMessage += `3. 图片已嵌入到对应单元格中，保持原始布局\n`;
                
                // 将提示信息显示在文件信息区域
                const fileInfoDiv = document.getElementById('file-info');
                fileInfoDiv.innerHTML += `<p>${promptMessage.replace(/\n/g, '<br>')}</p>`;
                
                // 在页面顶部显示简短提示
                alert('文件处理完成！点击下方下载链接获取修改后的文件。所有图片已成功嵌入到表格中。');
                
            } catch (error) {
                console.error('写入文件时出错:', error);
                alert('写入文件时出错: ' + error.message);
            }
        }
        
        /**
         * 计算好物体验sheet（sheet5）的种草金额总和
         */
        function calculateZhongcaoJinE(startRowIndex = 0, usedSheetData) {
            if (!window.targetSheet) {
                alert('未找到目标工作表，请先读取Excel文件');
                return;
            }
            debugger
            console.log("startRowIndex --->", startRowIndex)
            
            try {
                // 获取title前缀（从exportMonthConst.js中获取）
                const titlePrefix = exportMonthConst.title;
                
                const targetSheet = window.targetSheet;
                console.log('开始处理好物体验sheet');
                
                // 获取所有数据
                const sheetData = usedSheetData || targetSheet.getSheetValues();
                console.log('工作表数据行数:', sheetData.length);
                
                // 识别数据块并计算种草金额
                let foundDataBlock = false;
                let dataStartRow = -1;
                let headers = [];
                let monthColumns = [];
                let zhongcaoJinEIndex = -1;
                
                // 遍历所有行，找到数据块
                // 注意：sheetData[0]是null，不代表真正的第一行，从索引1开始处理
                for (let rowIndex = startRowIndex; rowIndex < sheetData.length; rowIndex++) {
                    const row = sheetData[rowIndex];
                    // 跳过第一个null元素，它不是真正的第一行
                    if (rowIndex === 0 && row === null) {
                        continue;
                    }
                    
                    // 检查是否是数据块标题行
                    if (!foundDataBlock) {
                        // 跳过第一个null值，检查剩余单元格
                        const actualRow = row ? row.slice(1) : [];
                        if (actualRow.some(cell => 
                            typeof cell === 'string' && cell.includes(titlePrefix))
                        ) {
                            foundDataBlock = true;
                            console.log('找到数据块标题行:', rowIndex + 1);
                            
                            // 下一行是属性名行
                            if (rowIndex + 1 < sheetData.length) {
                                headers = sheetData[rowIndex + 1];
                                // 跳过第一个null值，获取实际属性名
                                const actualHeaders = headers.slice(1);
                                console.log('属性名:', actualHeaders.filter(h => h !== null));
                                
                                // 识别所有月份列的索引（支持"X月"和"X月成交金额"格式）
                                // 注意：Excel列索引从1开始，所以需要加1
                                monthColumns = actualHeaders.map((header, index) => {
                                    if (typeof header === 'string' && header.match(/^\d+月(成交金额)?$/)) {
                                        return index + 1; // 调整为Excel的列索引（从1开始）
                                    }
                                    return null;
                                }).filter(index => index !== null);
                                console.log('月份列索引:', monthColumns);
                                
                                // 识别种草金额列的索引（找到第二个种草金额列）
                                const zhongcaoJinEIndices = actualHeaders.map((header, index) => {
                                    if (typeof header === 'string' && ['种草金额','内容种草\n成交金额'].includes(header)) {
                                        return index + 1; // 调整为Excel的列索引（从1开始）
                                    }
                                    return null;
                                }).filter(index => index !== null);
                                zhongcaoJinEIndex = zhongcaoJinEIndices.length > 1 ? zhongcaoJinEIndices[1] : -1;
                                console.log('种草金额列索引:', zhongcaoJinEIndex);
                                
                                // 数据从属性名行的下一行开始
                                dataStartRow = rowIndex + 2;
                            }
                        }
                    } else {
                        // 已经找到数据块，开始处理数据行
                        // 检查是否到达数据块结束（空行或新的数据块）
                        if (row && row.every(cell => cell === null || cell === undefined || cell === '')) {
                            // console.log('执行break',row)
                            continue;
                        }
                        
                        // 检查是否是新的数据块开始
                        const actualRow = row ? row.slice(1) : [];
                        // console.log('当前行数据:', actualRow,'sheetData[rowIndex]',sheetData[rowIndex+1])
                        const findTitleCell = actualRow.find(cell => 
                            typeof cell === 'string' && cell.includes(titlePrefix))
                        if (findTitleCell) {
                            // 判断是否有下一个表格
                            console.log("下一个表格的循环",rowIndex, findTitleCell)
                            calculateZhongcaoJinE(rowIndex-1, sheetData)
                            // if(rowIndex < sheetData.length - 1) {
                            // }
                            break;
                        }
                        
                        // 处理数据行
                        if (row && monthColumns.length > 0 && zhongcaoJinEIndex !== -1) {
                            let zhongcaoJinE = 0;
                            let hasValidData = false;
                            
                            // 遍历所有月份列，累加金额
                            monthColumns.forEach(colIndex => {
                                // colIndex已经是Excel的列索引（从1开始），所以直接使用
                                const cellValue = row[colIndex];
                                if (cellValue !== null && cellValue !== undefined && !isNaN(cellValue)) {
                                    zhongcaoJinE += Number(cellValue);
                                    hasValidData = true;
                                }
                            });
                            
                            // 更新种草金额字段
                            if (hasValidData) {
                                // 使用sheet.getRow().getCell()直接修改单元格数据
                                // 注意：由于sheetData[0]是null，实际数据从sheetData[1]开始
                                // 所以Excel行索引就是rowIndex（而不是rowIndex + 1）
                                const excelRowIndex = rowIndex; // Excel行索引从1开始，sheetData[1]对应Excel第1行
                                const excelColIndex = zhongcaoJinEIndex; // Excel列索引从1开始
                                
                                const excelRow = targetSheet.getRow(excelRowIndex);
                                const targetCell = excelRow.getCell(excelColIndex);
                                targetCell.value = zhongcaoJinE;
                                console.log(`更新行 ${excelRowIndex} 列 ${excelColIndex} 的种草金额为: ${zhongcaoJinE}`);
                            }
                        }
                    }
                }
                
                
            } catch (error) {
                console.error('计算种草金额时出错:', error);
                alert('计算种草金额时出错: ' + error.message);
            }
        }
        
        // 在writeExcelFile函数中调用calculateZhongcaoJinE
        // 已在前面添加
    </script>
